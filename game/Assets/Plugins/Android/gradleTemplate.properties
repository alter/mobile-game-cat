# Unity's default gradle properties template, plus one line.
#
# The three ** ** tokens and unityStreamingAssets are Unity's own and must
# stay: this file replaces
# <Editor>/PlaybackEngines/AndroidPlayer/Tools/GradleTemplates/gradleTemplate.properties
# wholesale once it exists, and dropping a token breaks the build rather than
# the feature.
#
# android.useAndroidX is the added line. Task 60-shell-build/15's Android
# plug-in (CatShare.androidlib) depends on androidx.core for FileProvider, and
# Unity does not enable AndroidX by default - its shipped template has no such
# line. Without it the Android Gradle Plugin refuses the dependency.
#
# android.enableJetifier is deliberately NOT set: it rewrites old
# support-library artifacts, we have none, and it is removed in recent AGP.

org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M
org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**

android.useAndroidX=true

**ADDITIONAL_PROPERTIES**
