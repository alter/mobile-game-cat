// tools/tests/android-vision: an instrumented harness for
// game/Assets/Plugins/Android/CatVision.androidlib, the Android counterpart of
// tools/vision-probe.
//
// It is a separate Gradle build on purpose. The plug-in's own build.gradle
// reads compileSdk off :unityLibrary and only exists inside a Unity-generated
// Gradle project; this one supplies those values itself and compiles the SAME
// source files (see app/build.gradle sourceSets), so the numbers in
// tasks/50-photo/05-vision-plugin/NOTES-android.md come from the shipped code
// rather than from a copy of it.
pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositories { google(); mavenCentral() }
}
rootProject.name = 'android-vision-probe'
include ':app'
